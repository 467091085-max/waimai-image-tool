schema_version: 1
researched_at: "2026-08-12"
purpose: "40-category commercial food-background art direction for original generation"
platform_rules:
  - url: "https://i.waimai.meituan.com/node/rules/businessrules"
    use: "4:3, clear, complete, appetizing, category-consistent, no unauthorized watermark or logo"
  - url: "https://i.waimai.meituan.com/node/gongshanghegui/norm"
    use: "dish image must match the sold item, keep a clean background, and contain no other-platform image"
research_boundary:
  competitor_assets_downloaded: false
  competitor_assets_allowed_in_catalog: false
  output_requirement: "Only newly generated original backgrounds without food, people, text, logos, watermarks, or identifiable proprietary brand layouts."
  monthly_sales_5000_evidence: "unknown"
  limitation: "No stable public primary-source evidence was found for a specific Meituan store exceeding 5000 monthly orders. Brand scale, store count, and cumulative sales are not treated as monthly-sales proof."
